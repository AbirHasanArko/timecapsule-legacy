name: Build iOS App (TimeCapsule)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build iOS Application (Unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild clean build \
            -project TimeCapsule.xcodeproj \
            -scheme TimeCapsule \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log || {
              echo "=== XCODEBUILD FAILED: ERROR SUMMARY ==="
              grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" build/xcodebuild.log || tail -n 60 build/xcodebuild.log
              exit 1
            }

      - name: Package Application into IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "TimeCapsule.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: TimeCapsule.app not found in build directory!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r TimeCapsule.ipa Payload
          echo "Packaged TimeCapsule.ipa successfully ($(du -h TimeCapsule.ipa | cut -f1))."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeCapsule-iOS-App
          path: build/TimeCapsule.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xcodebuild-Log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

